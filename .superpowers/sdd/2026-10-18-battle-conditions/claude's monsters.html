const TRAUMA_MINE_HEAVY = 0.9;    // a CRACKED SEAM (0.9^2 * 4 = ~3 px; still clamped at 1.0 -> WORLD_SHAKE_MAX)
const MINE_HITSTOP = 0.06;        // s the world fx hold on a seam break (0 with reduced motion); input never stops
const DEBRIS_BURST_HEAVY = 20;    // rock chips per seam break (a boulder gets DEBRIS_BURST)
const DEBRIS_BURST_HEAVY_ORE = 10; // ORE glints per seam break
const DEBRIS_SPEED_HEAVY = 150;   // px/s, +-50%: seam chips fly further
const GEODE_DOOR = (() => {       // the entrance seam on the GEODE's bottom row
  for (let x = GEODE[0]; x <= GEODE[2]; x++) if (MAP[GEODE[3]][x] === SEAM) return [x, GEODE[3]];
  return null;
})();
const GEODE_GLINT_ONE_IN = 3;     // 1 in N open GEODE tiles carries a crystal (by tileHash)
const GEODE_GLINT_PERIOD = 1.7;   // s between glints on one crystal
const GEODE_GLINT_TIME = 0.45;    // s each glint lasts
const GEODE_GLINT = '#c49cff';
const GEODE_GLINT_HI = '#f4eaff';
const GEODE_GLOW = [150, 110, 230]; // a soft violet wash over the opened pocket, above the lantern dark
const GEODE_GLOW_ALPHA = 48;      // peak alpha (0-255) at the pocket's centre; static, so kept with reduced motion
const GEODE_GLOW_STEPS = 6;       // nested ellipses that build the wash (each adds ALPHA / STEPS)
const HUD_MAT_RECT = [8, 42, 250, 24];        // materials + pick tier panel (ends y=66, above CRAFT_RECT)
const HUD_CAVE_RECT = [W / 2 - 105, 8, 210, 30];   // DARK CAVE lantern/tension/PULSE line (cave only)
const HUD_LEAD_RECT = [W - 166, 8, 158, 30];  // lead monster HP box
const HUD_TIER_COL = ['#6f8ba8', '#bfe0ff', ORE_GLINT];   // NONE / PICK / IRON PICK label
const MENU_W = 190;
const MENU_Y = 46;                // below the lead-HP box (ends y=38); was 16, which overlapped it

function easeOutBack(u) { const c3 = POP_BACK + 1; return 1 + c3 * Math.pow(u - 1, 3) + POP_BACK * Math.pow(u - 1, 2); }

const WFX = { trauma: 0, freeze: 0, cracks: new Map(), pops: new Map() };   // freeze: hit-stop, s   // 'x,y' -> {t, tile} / seconds
const DEBRIS = [];
for (let i = 0; i < DEBRIS_MAX; i++) DEBRIS.push({ x: 0, y: 0, vx: 0, vy: 0, life: 0, max: 1, size: 2, col: '#fff', grav: 0 });
const FLOATS = [];
for (let i = 0; i < FLOAT_MAX; i++) FLOATS.push({ on: false, age: 0, delay: 0, wx: 0, wy: 0, s: '', col: '#fff' });

function resetWorldFx() {
  WFX.trauma = 0; WFX.freeze = 0; WFX.cracks.clear(); WFX.pops.clear();
  for (let i = 0; i < DEBRIS_MAX; i++) DEBRIS[i].life = 0;
  for (let i = 0; i < FLOAT_MAX; i++) FLOATS[i].on = false;
}

function spray(x, y, n, cols, speed, grav, size) {
  let spawned = 0;
  for (let k = 0; k < DEBRIS_MAX && spawned < n; k++) {
    const p = DEBRIS[k];
    if (p.life > 0) continue;
    const ang = fxRand() * Math.PI * 2;
    const spd = speed * (0.5 + fxRand());
    p.x = x + (fxRand() * 2 - 1) * 8; p.y = y + (fxRand() * 2 - 1) * 8;
    p.vx = Math.cos(ang) * spd; p.vy = Math.sin(ang) * spd - speed * 0.6;   // chips kick upward first
    p.max = p.life = DEBRIS_LIFE * (0.6 + fxRand() * 0.8);
    p.size = size * (0.6 + fxRand() * 0.8);
    p.col = cols[spawned % cols.length];
    p.grav = grav;
    spawned++;
  }
  return spawned;
}

function floatLabel(wx, wy, s, col, delay) {
  for (let i = 0; i < FLOAT_MAX; i++) {
    const f = FLOATS[i];
    if (f.on) continue;
    f.on = true; f.age = 0; f.delay = delay; f.wx = wx; f.wy = wy; f.s = s; f.col = col;
    return true;
  }
  return false;
}

function worldFx(kind, x, y, tile, drops) {
  const cx = x * TILE + TILE / 2, cy = y * TILE + TILE / 2, key = x + ',' + y;
  const calm = REDUCED_MOTION;
  if (kind === 'mine') {
    const ore = !!drops.ore;
    const heavy = !!BLOCKS[tile] && BLOCKS[tile].tier >= 2;          // a CRACKED SEAM
    WFX.cracks.set(key, { t: CRACK_TIME, tile });
    WFX.pops.delete(key);
    WFX.trauma = Math.min(1, WFX.trauma + (heavy ? TRAUMA_MINE_HEAVY : ore ? TRAUMA_MINE_ORE : TRAUMA_MINE));
    if (heavy && !calm) WFX.freeze = Math.max(WFX.freeze, MINE_HITSTOP);
    spray(cx, cy, calm ? DEBRIS_BURST_REDUCED : heavy ? DEBRIS_BURST_HEAVY : DEBRIS_BURST, STONE_CHIPS,
          heavy ? DEBRIS_SPEED_HEAVY : DEBRIS_SPEED, DEBRIS_GRAVITY, heavy ? 3.5 : 3);
    if (ore) spray(cx, cy, calm ? 1 : heavy ? DEBRIS_BURST_HEAVY_ORE : DEBRIS_BURST_ORE,
                   [ORE_GLINT, ORE_GLINT_HI], DEBRIS_SPEED * 1.2, DEBRIS_GRAVITY, 2.5);
    if (tile === WALL) spray(cx, cy + 8, calm ? DEBRIS_BURST_REDUCED : DUST_BURST, [DUST_COL], DUST_SPEED, DUST_GRAVITY, 4);
    const ks = Object.keys(drops).sort((a, b) => (a !== 'stone') - (b !== 'stone'));
    ks.forEach((k, i) => floatLabel(cx, y * TILE - 4 - i * FLOAT_LINE,
      '+' + drops[k] + ' ' + MATERIAL_LABEL[k], FLOAT_COL[k] || '#ffffff', i * FLOAT_STAGGER));
  } else if (kind === 'lunge' || kind === 'pulse') {
    caveFxEvent(kind, x, y, drops);
  } else if (kind === 'place') {
    WFX.pops.set(key, 0);
    WFX.cracks.delete(key);
    spray(cx, cy + 12, Math.floor((calm ? DEBRIS_BURST_REDUCED : DUST_BURST) / 2), [DUST_COL], DUST_SPEED, DUST_GRAVITY, 3.5);
  }
}

// World-fx animation time only. During a hit-stop the debris, crack frame,
// labels and shake decay hold still; the game (movement, input, the clock the
// tells read) runs on in update() and never waits.
function updateWorldFx(dt) {
  if (WFX.freeze > 0) { WFX.freeze = Math.max(0, WFX.freeze - dt); return; }
  WFX.trauma = Math.max(0, WFX.trauma - TRAUMA_DECAY * dt);
  for (const [k, c] of WFX.cracks) { c.t -= dt; if (c.t <= 0) WFX.cracks.delete(k); }
  for (const [k, t] of WFX.pops) { if (t + dt >= POP_TIME) WFX.pops.delete(k); else WFX.pops.set(k, t + dt); }
  for (let i = 0; i < DEBRIS_MAX; i++) {
    const p = DEBRIS[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vy += p.grav * dt;
    p.x += p.vx * dt; p.y += p.vy * dt;
  }
  for (let i = 0; i < FLOAT_MAX; i++) {
    const f = FLOATS[i];
    if (!f.on) continue;
    f.age += dt;
    if (f.age >= f.delay + FLOAT_TIME) f.on = false;
  }
}

function worldOffset() {
  const k = WFX.trauma * WFX.trauma * WORLD_SHAKE_MAX * SHAKE_SCALE;
  if (k <= 0) return [0, 0];
  return [Math.round((fxRand() * 2 - 1) * k), Math.round((fxRand() * 2 - 1) * k)];
}

// Scale of a WALL still popping in, or null once it has settled.
function popScale(key) {
  if (!WFX.pops.has(key)) return null;
  if (REDUCED_MOTION) return 1;
  return POP_FROM + (1 - POP_FROM) * easeOutBack(Math.min(1, WFX.pops.get(key) / POP_TIME));
}

function liveDebris() { let n = 0; for (let i = 0; i < DEBRIS_MAX; i++) if (DEBRIS[i].life > 0) n++; return n; }

/* --- DARK CAVE horror kit: look, sound and feel (shell only) ----------------
   Same names and values as the pygame build. Nothing here is read by game
   logic; every random draw is fxRand, never Math.random or the stalker's
   mulberry32. Fed by worldFx('lunge' / 'pulse'), advanced by updateCaveFx,
   drawn by drawOverworld. Fixed pools: no allocation per frame. */
const LAMP_TINT = [120, 66, 16];  // warm wash over the lit floor; about as bright as the floor, so it tints, not lights
const LAMP_TINT_ALPHA = 44;       // its alpha (0-255) where the soft edge begins; 0 at the clear core
const LAMP_DARK = [6, 4, 12];     // the unlit cave
const LAMP_DARK_ALPHA = 238;      // its alpha outside the lantern
const LAMP_FEATHER = [0.8, 1.15]; // x lit radius: fully lit inside the first, fully dark past the second
const LAMP_FLICKER_BELOW = 25;    // % charge under which the flame gutters (none with reduced motion)
const LAMP_FLICKER_ALPHA = 80;    // peak extra dark over the lit ring at an empty lamp (core stays clear)
const LAMP_FLICKER_RATE = 9;      // new flicker targets per second (eased between)
const HUD_CAVE_BAR_X = 52;        // the LAMP / TENSION bars start this far into HUD_CAVE_RECT
const HUD_CAVE_BAR_W = 84;
const HUD_CAVE_BAR_H = 6;
const HUD_CAVE_ROWS = [7, 19];    // y of the LAMP row and the TENSION row inside HUD_CAVE_RECT
const HUD_TENSION_FROM = 25;      // the TENSION row shows from here
const HUD_LAMP_LOW = 20;          // % under which the LAMP bar turns from amber to red-orange
const VIGNETTE_FROM = 50;         // tension at which the edge vignette starts...
const VIGNETTE_MIN = 30;          // ...at this alpha (0-255),
const VIGNETTE_MAX = 120;         // rising linearly to this at tension 100
const VIGNETTE_PULSE = 40;        // extra alpha on each heartbeat at fear (none with reduced motion)
const HEART_HZ_MIN = 1.2;         // heartbeats per second at fear (TENSION.fear)...
const HEART_HZ_MAX = 1.8;         // ...rising to this at tension 100
const HEART_DUB = 0.18;           // the "dub" lands this far (fraction of a beat) after the "lub"
const GRAIN_TILE = 128;           // px square film-grain tile, generated once
const GRAIN_ALPHA = 46;           // peak per-pixel alpha of the static
const GRAIN_FPS = 24;             // the static re-rolls its offset this often
const TEAR_EVERY = 2.0;           // s, mean gap between horizontal tear lines (fear only)
const TEAR_TIME = 0.12;           // s each tear lasts
const TEAR_SHIFT = 6;             // px a tear slides its strip sideways
const TEAR_MAX = 2;               // tears alive at once (fixed pool)
const EYE_COL = [255, 70, 90];    // hunting eyes
const EYE_STUN_COL = [110, 124, 150]; // dimmed, stunned eyes
const EYE_BLINK_EVERY = 2.8;      // s, mean gap between blinks
const EYE_BLINK_TIME = 0.12;      // s a blink lasts
const EYE_BOB = 1.5;              // px the eyes drift (none with reduced motion)
const STALKER_SHADE = [70, 60, 96]; // the GLOOMSTALK sprite darkened to a shadow, not a monster
const STALKER_GLIDE = 0.18;       // s the body takes to slide one tile (snaps with reduced motion)
const TRAIL_MAX = 6;              // fading eye ghosts behind a moving hunter (fixed pool)
const TRAIL_TIME = 0.35;          // s each ghost lasts
const LUNGE_TIME = 0.28;          // s of eye flare + jolt before the cut to the hunt (none with reduced motion)
const LUNGE_TRAUMA = 0.9;         // world jolt (0.81 * WORLD_SHAKE_MAX = ~3 px)
const LUNGE_EYE_SCALE = 2.6;      // the eyes swell to this as it springs
const LUNGE_FLASH_ALPHA = 90;     // the one red flash over the world (decays, never repeats)
const PULSE_RING_TIME = 0.45;     // s the wavefront takes to run PULSE.range tiles (by path)
const PULSE_RING_FADE = 0.25;     // s the lit tiles take to fade once it has passed
const PULSE_RING_ALPHA = 150;     // wavefront strength (0-255)
const PULSE_HIT_COL = [150, 236, 255];
const PULSE_MISS_COL = [120, 136, 170];
const PULSE_HIT_TRAUMA = 0.6;     // jolt when the PULSE catches it (none on a miss)
const PULSE_SPARKS = 14;          // sparks off the stunned stalker (a miss throws none)
const DRONE_VOL = 0.18;           // ambient cave drone volume at tension 100 (a quarter of it at 0)

const rgbStr = (c, a) => a === undefined ? 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'
                                         : 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
function smoothstep(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }

// Half-size in px of the lantern's hole sprite: the lit radius times the
// outer edge of the feather (fully dark beyond it).
function lampHoleRadius(charge) { return Math.ceil(Math.round(lanternRadius(charge) * TILE) * LAMP_FEATHER[1]); }

// [rgb, alpha] of the lantern mask d px from the flame, for a lit radius of
// lit px: clear inside the core, a warm wash out to the feather, then a
// smoothstep into the dark.
function lampProfile(d, lit) {
  const core = LANTERN.corePx;
  if (d <= core) return [LAMP_DARK, 0];
  const inner = lit * LAMP_FEATHER[0], outer = lit * LAMP_FEATHER[1];
  if (d <= inner) return [LAMP_TINT, Math.floor(LAMP_TINT_ALPHA * (d - core) / Math.max(1, inner - core) + 0.5)];
  const e = smoothstep((d - inner) / (outer - inner));
  const rgb = LAMP_TINT.map((a, i) => Math.floor(a + (LAMP_DARK[i] - a) * e + 0.5));
  return [rgb, Math.floor(LAMP_TINT_ALPHA * (1 - e) + LAMP_DARK_ALPHA * e + 0.5)];
}

// 0..1: how hard the flame gutters - none above LAMP_FLICKER_BELOW %.
function lampFlickerAmp(charge, reduced) {
  if (reduced || charge >= LAMP_FLICKER_BELOW) return 0;
  return (LAMP_FLICKER_BELOW - Math.max(0, charge)) / LAMP_FLICKER_BELOW;
}

// Edge vignette alpha: none under VIGNETTE_FROM, then linear to VIGNETTE_MAX.
function vignetteAlpha(tension) {
  const t = clamp(tension, 0, TENSION.max);
  if (t < VIGNETTE_FROM) return 0;
  return Math.floor(VIGNETTE_MIN + (VIGNETTE_MAX - VIGNETTE_MIN) * (t - VIGNETTE_FROM) / (TENSION.max - VIGNETTE_FROM) + 0.5);
}

// Heartbeats per second: none below fear, HEART_HZ_MIN..MAX above it.
function heartHz(tension) {
  const t = clamp(tension, 0, TENSION.max);
  if (t < TENSION.fear) return 0;
  return HEART_HZ_MIN + (HEART_HZ_MAX - HEART_HZ_MIN) * (t - TENSION.fear) / (TENSION.max - TENSION.fear);
}

// 0..1 swell of one lub-dub, phase 0..1 through the beat.
function heartEnv(phase) {
  const lub = Math.exp(-phase / 0.07);
  const dub = phase >= HEART_DUB ? 0.65 * Math.exp(-(phase - HEART_DUB) / 0.07) : 0;
  return Math.max(lub, dub);
}

// What the screen does at this tension. Reduced motion keeps a static
// vignette, the HUD meter and the heartbeat sound - no pulse, grain or tears.
function tensionFx(tension, reduced) {
  const fear = clamp(tension, 0, TENSION.max) >= TENSION.fear, moving = fear && !reduced;
  return { vignette: vignetteAlpha(tension), pulse: moving, grain: moving, tears: moving, heart: heartHz(tension) };
}

// 1 -> 0 over LUNGE_TIME: the one flash of the lunge (it only ever decays).
function lungeFlare(age) {
  if (age === null || age === undefined || age < 0 || age >= LUNGE_TIME) return 0;
  const u = age / LUNGE_TIME;
  return (1 - u) * (1 - u);
}

// Absolute rects and fills of the cave HUD bars inside HUD_CAVE_RECT. tension
// is null below HUD_TENSION_FROM; label makes fear readable without colour.
function caveHudBars(charge, tension) {
  const x = HUD_CAVE_RECT[0], y = HUD_CAVE_RECT[1];
  const c = clamp(Math.trunc(charge), 0, LANTERN.max), t = clamp(Math.trunc(tension), 0, TENSION.max);
  const fear = t >= TENSION.fear, show = t >= HUD_TENSION_FROM;
  return {
    lamp: [x + HUD_CAVE_BAR_X, y + HUD_CAVE_ROWS[0], HUD_CAVE_BAR_W, HUD_CAVE_BAR_H],
    lampFill: Math.floor((HUD_CAVE_BAR_W * c + Math.floor(LANTERN.max / 2)) / LANTERN.max),
    low: c < HUD_LAMP_LOW,
    tension: show ? [x + HUD_CAVE_BAR_X, y + HUD_CAVE_ROWS[1], HUD_CAVE_BAR_W, HUD_CAVE_BAR_H] : null,
    tensionFill: show ? Math.floor((HUD_CAVE_BAR_W * t + Math.floor(TENSION.max / 2)) / TENSION.max) : 0,
    fear, label: fear ? 'FEAR!' : 'TENSION' };
}

// Which eyes read through the dark: 'stun' (dimmed) while stunned, 'hunt'
// while it hunts within sense (Manhattan - a lower bound on its path, so no
// BFS per frame), else null.
function stalkerEyes(st, player, charge, tension) {
  if (!st) return null;
  if (st.stun > 0) return 'stun';
  if (st.mode !== 'hunt') return null;
  const d = Math.abs(st.x - player[0]) + Math.abs(st.y - player[1]);
  return d <= stalkerSense(charge, tension) ? 'hunt' : null;
}

// [[x, y, path distance]] the PULSE wavefront lights: every tile its BFS
// reaches within PULSE.range, so it pours round rock, never through it.
function pulseRing(reach) {
  const out = [];
  for (const [k, d] of reach) if (d <= PULSE.range) { const [x, y] = k.split(',').map(Number); out.push([x, y, d]); }
  return out.sort((a, b) => a[2] - b[2] || a[1] - b[1] || a[0] - b[0]);
}

let CAVE_CALM = null;             // test seam: null follows REDUCED_MOTION
function caveCalm() { return CAVE_CALM === null ? REDUCED_MOTION : CAVE_CALM; }
function setCaveCalm(v) { CAVE_CALM = v === null ? null : !!v; }

const CFX = { trail: [], tears: [], pendingConfirm: false };
for (let i = 0; i < TRAIL_MAX; i++) CFX.trail.push({ x: 0, y: 0, t: 0 });
for (let i = 0; i < TEAR_MAX; i++) CFX.tears.push({ t: 0, y: 0, h: 0, dx: 0 });
function resetCaveFx() {
  Object.assign(CFX, { hbPhase: 0, hbOn: false, beats: 0, flicker: 0, flickerTo: 0, flickerT: 0,
    grainT: 0, grainX: 0, grainY: 0, tearWait: TEAR_EVERY, blinkWait: EYE_BLINK_EVERY, blink: 0,
    stTo: null, stFromX: 0, stFromY: 0, glide: 1, lungeAge: null, lungeAt: [0, 0], ring: null });
  for (const tr of CFX.trail) tr.t = 0;
  for (const te of CFX.tears) te.t = 0;
}
resetCaveFx();

function caveFxEvent(kind, x, y, drops) {
  const calm = caveCalm();
  if (kind === 'lunge') {
    if (calm) return;                       // the fade and the text carry it
    CFX.lungeAge = 0; CFX.lungeAt = [x, y];
    WFX.trauma = Math.max(WFX.trauma, LUNGE_TRAUMA);
  } else if (kind === 'pulse') {
    const hit = !!(drops && drops.hit);
    const reach = caveDist([x, y], G.edits, G.picked, npcTiles(), true);
    CFX.ring = { age: 0, x, y, hit, tiles: pulseRing(reach) };
    sfx(hit ? 'pulseHit' : 'pulseMiss');
    const st = G.stalker;
    if (hit && st) {
      WFX.trauma = Math.min(1, WFX.trauma + PULSE_HIT_TRAUMA);
      spray(st.x * TILE + TILE / 2, st.y * TILE + TILE / 2 - 4, calm ? DEBRIS_BURST_REDUCED : PULSE_SPARKS,
            [rgbStr(PULSE_HIT_COL), '#ffffff'], DEBRIS_SPEED, -60, 2.5);
    }
  }
}

// World px centre the body is drawn at (it glides tile to tile).
function stalkerPx(st) {
  const tx = st.x * TILE + TILE / 2, ty = st.y * TILE + TILE / 2;
  if (!CFX.stTo || CFX.stTo[0] !== st.x || CFX.stTo[1] !== st.y || CFX.glide >= 1) return [tx, ty];
  const k = smoothstep(CFX.glide);
  return [CFX.stFromX + (tx - CFX.stFromX) * k, CFX.stFromY + (ty - CFX.stFromY) * k];
}

function updateCaveFx(dt) {
  const calm = caveCalm();
  const live = G.mode === 'overworld' && inCave(G.player.ty);
  const fx = tensionFx(G.tension, calm);
  // Heartbeat: the sound stays with reduced motion; the first beat lands at once.
  if (live && fx.heart > 0) {
    if (!CFX.hbOn) { CFX.hbOn = true; CFX.hbPhase = 0.999; }
    CFX.hbPhase += dt * fx.heart;
    if (CFX.hbPhase >= 1) { CFX.hbPhase -= 1; CFX.beats++; sfx('heartbeat'); }
  } else if (G.mode !== 'menu' && G.mode !== 'craft') CFX.hbOn = false;
  // The flame gutters at low charge.
  if (lampFlickerAmp(G.lantern, calm) > 0) {
    CFX.flickerT -= dt;
    if (CFX.flickerT <= 0) { CFX.flickerT = 1 / LAMP_FLICKER_RATE; const r = fxRand(); CFX.flickerTo = r * r; }
    CFX.flicker += (CFX.flickerTo - CFX.flicker) * Math.min(1, dt * 20);
  } else { CFX.flicker = 0; CFX.flickerTo = 0; }
  // Film grain and tear lines: fear only, never with reduced motion.
  if (fx.grain) {
    CFX.grainT -= dt;
    if (CFX.grainT <= 0) {
      CFX.grainT = 1 / GRAIN_FPS;
      CFX.grainX = Math.floor(fxRand() * GRAIN_TILE); CFX.grainY = Math.floor(fxRand() * GRAIN_TILE);
    }
  }
  for (const te of CFX.tears) te.t = fx.tears ? Math.max(0, te.t - dt) : 0;
  if (fx.tears && live) {
    CFX.tearWait -= dt;
    if (CFX.tearWait <= 0) {
      CFX.tearWait = TEAR_EVERY * (0.5 + fxRand());
      const te = CFX.tears.find(q => q.t <= 0);
      if (te) {
        te.t = TEAR_TIME; te.y = 60 + Math.floor(fxRand() * (H - 120));
        te.h = 2 + Math.floor(fxRand() * 4); te.dx = fxRand() < 0.5 ? TEAR_SHIFT : -TEAR_SHIFT;
      }
    }
  }
  // Eyes blink now and then.
  CFX.blink = Math.max(0, CFX.blink - dt);
  CFX.blinkWait -= dt;
  if (CFX.blinkWait <= 0) { CFX.blink = EYE_BLINK_TIME; CFX.blinkWait = EYE_BLINK_EVERY * (0.5 + fxRand()); }
  // The body glides between tiles; a hunting one leaves fading eye ghosts.
  const st = G.stalker;
  if (!st) CFX.stTo = null;
  else if (!CFX.stTo || CFX.stTo[0] !== st.x || CFX.stTo[1] !== st.y) {
    const near = CFX.stTo && Math.abs(st.x - CFX.stTo[0]) + Math.abs(st.y - CFX.stTo[1]) <= 2;
    if (near && !calm) {
      const [fx0, fy0] = stalkerPx(Object.assign({}, st, { x: CFX.stTo[0], y: CFX.stTo[1] }));  // from wherever it is drawn now
      CFX.stFromX = fx0; CFX.stFromY = fy0; CFX.glide = 0;
      if (st.mode === 'hunt') {
        const tr = CFX.trail.find(q => q.t <= 0);
        if (tr) { tr.x = fx0; tr.y = fy0; tr.t = TRAIL_TIME; }
      }
    } else CFX.glide = 1;
    CFX.stTo = [st.x, st.y];
  }
  CFX.glide = Math.min(1, CFX.glide + dt / STALKER_GLIDE);
  for (const tr of CFX.trail) if (tr.t > 0) tr.t = Math.max(0, tr.t - dt);
  if (CFX.lungeAge !== null) { CFX.lungeAge += dt; if (CFX.lungeAge >= LUNGE_TIME) CFX.lungeAge = null; }
  if (CFX.ring) { CFX.ring.age += dt; if (CFX.ring.age >= PULSE_RING_TIME + PULSE_RING_FADE) CFX.ring = null; }
  // A confirm pressed while the lunge flare held the screen is replayed now.
  if (CFX.pendingConfirm && CFX.lungeAge === null) { CFX.pendingConfirm = false; confirmKey(); }
  caveDrone(live || (inCave(G.player.ty) && ['menu', 'craft', 'dialogue'].includes(G.mode))
    ? DRONE_VOL * (0.25 + 0.75 * clamp(G.tension, 0, TENSION.max) / TENSION.max) : 0);
}

function tearsLive() { let n = 0; for (const te of CFX.tears) if (te.t > 0) n++; return n; }

// 0..PULSE_RING_ALPHA for a ring tile at path distance d right now: bright on
// the wavefront, then fading. Reduced motion: no travelling front, every
// reached tile just fades together.
function ringAlpha(d) {
  const r = CFX.ring;
  if (!r) return 0;
  const a = PULSE_RING_ALPHA * (r.hit ? 1 : 0.6), age = r.age;
  if (caveCalm()) return Math.trunc(a * 0.5 * Math.max(0, 1 - age / (PULSE_RING_TIME + PULSE_RING_FADE)));
  const front = (PULSE.range + 1) * Math.min(1, age / PULSE_RING_TIME);
  if (d > front) return 0;
  const v = age < PULSE_RING_TIME ? Math.max(0.35, 1 - (front - d) / 1.5)    // bright on the front, a glow behind it
                                  : 0.35 * Math.max(0, 1 - (age - PULSE_RING_TIME) / PULSE_RING_FADE);
  return Math.trunc(a * v);
}

// ORE boulders, from the deterministic mineDrop: computed once, so the glint
// is a fixed property of the tile, never a per-frame search of the map.
const ORE_SPOTS = [];
for (let y = ROCK_BAND[0]; y <= ROCK_BAND[1]; y++) {
  for (let x = 0; x < MAP_W; x++) {
    const t = MAP[y][x];
    if (canMine(t, x, y, true) && mineDrop(t, x, y).ore) ORE_SPOTS.push([x, y]);
  }
}

// [[x, y, strength]] of ORE boulders glinting this frame: only unmined ones
// within SPARKLE_RADIUS tiles of the player, so it hints rather than maps.
function oreTells() {
  const px = G.player.tx, py = G.player.ty, out = [];
  const w = SPARKLE_TIME / SPARKLE_PERIOD;
  for (const [x, y] of ORE_SPOTS) {
    if (Math.max(Math.abs(x - px), Math.abs(y - py)) > SPARKLE_RADIUS || tileHere(x, y) !== '#') continue;
    if (REDUCED_MOTION) { out.push([x, y, 0.6]); continue; }      // steady, no blinking
    const ph = ((G.time / SPARKLE_PERIOD + (tileHash(x, y) & 255) / 256) % 1 + 1) % 1;
    if (ph < w) out.push([x, y, Math.sin(Math.PI * ph / w)]);
  }
  return out;
}

// The authored seams and the GEODE crystals (open pocket tiles picked by
// tileHash), both fixed: no per-frame map search.
const SEAM_SPOTS = [], GEODE_SPOTS = [];
for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) if (MAP[y][x] === SEAM) SEAM_SPOTS.push([x, y]);
for (let y = GEODE[1]; y <= GEODE[3]; y++) {
  for (let x = GEODE[0]; x <= GEODE[2]; x++) {
    if ('c;,'.includes(MAP[y][x]) && tileHash(x, y) % GEODE_GLINT_ONE_IN === 0) GEODE_SPOTS.push([x, y]);
  }
}

// True once the GEODE's entrance seam has been mined.
function geodeOpen() { return tileHere(GEODE_DOOR[0], GEODE_DOOR[1]) !== SEAM; }

// A GEODE pocket tile drawn as solid rock because the pocket is still sealed:
// the lantern would otherwise show its grass through the wall.
function geodeMasked(x, y, opened) {
  if (x < GEODE[0] || x > GEODE[2] || y < GEODE[1] || y > GEODE[3]) return false;
  if (MAP[y][x] === 'C' || MAP[y][x] === SEAM) return false;
  return !(opened === undefined ? geodeOpen() : opened);
}

// [[x, y, strength]] of unmined CRACKED SEAMs glinting this frame: only with
// the IRON PICK, within SPARKLE_RADIUS, and only a seam with an open face (the
// sealed GEODE's inner seam stays quiet until the pocket opens).
function seamTells() {
  if (pickTier(G.flags.pick) < 2) return [];
  const px = G.player.tx, py = G.player.ty, out = [], opened = geodeOpen();
  const w = SPARKLE_TIME / SPARKLE_PERIOD;
  for (const [x, y] of SEAM_SPOTS) {
    if (Math.max(Math.abs(x - px), Math.abs(y - py)) > SPARKLE_RADIUS || tileHere(x, y) !== SEAM) continue;
    if (!DIRS4.some(([dx, dy]) => !SOLID.has(tileHere(x + dx, y + dy)) && !geodeMasked(x + dx, y + dy, opened))) continue;
    if (REDUCED_MOTION) { out.push([x, y, 0.6]); continue; }      // steady, no blinking (as the ORE tell)
    const ph = ((G.time / SPARKLE_PERIOD + (tileHash(x, y) & 255) / 256) % 1 + 1) % 1;
    if (ph < w) out.push([x, y, Math.sin(Math.PI * ph / w)]);
  }
  return out;
}

// [[x, y, strength]] of GEODE crystals glinting this frame: none until the
// entrance seam is mined, none with reduced motion.
function geodeGlints() {
  if (REDUCED_MOTION || !geodeOpen()) return [];
  const w = GEODE_GLINT_TIME / GEODE_GLINT_PERIOD, out = [];
  for (const [x, y] of GEODE_SPOTS) {
    const ph = ((G.time / GEODE_GLINT_PERIOD + (tileHash(x, y) >> 8) / 256) % 1 + 1) % 1;
    if (ph < w) out.push([x, y, Math.sin(Math.PI * ph / w)]);
  }
  return out;
}

function drawGlint(x, y, k, col, hi) {
  const h = tileHash(x, y);
  const gx = Math.round(x * TILE - camX) + 9 + (h >> 4) % 14;
  const gy = Math.round(y * TILE - camY) + 8 + (h >> 8) % 12;
  const r = 1 + Math.round(4 * k);
  ctx.fillStyle = col;
  ctx.fillRect(gx - r, gy, r * 2 + 1, 1);
  ctx.fillRect(gx, gy - r, 1, r * 2 + 1);
  ctx.fillStyle = hi;
  ctx.fillRect(gx - 1, gy - 1, 2, 2);
}

// The opened GEODE over the lantern dark: a soft static violet wash and its
// crystal glints, so the pocket reads as special from its doorway.
let geodeGlow = null;
function drawGeodeLight() {
  if (!geodeOpen()) return;
  const gw = (GEODE[2] - GEODE[0] + 1) * TILE, gh = (GEODE[3] - GEODE[1]) * TILE;   // open rows only
  const sx = Math.round(GEODE[0] * TILE - camX), sy = Math.round(GEODE[1] * TILE - camY);
  if (sx > W || sy > H || sx + gw < 0 || sy + gh < 0) return;
  if (!geodeGlow) {
    geodeGlow = document.createElement('canvas');
    geodeGlow.width = gw; geodeGlow.height = gh;
    const m = geodeGlow.getContext('2d');
    m.fillStyle = 'rgba(' + GEODE_GLOW.join(',') + ',' + (Math.floor(GEODE_GLOW_ALPHA / GEODE_GLOW_STEPS) / 255) + ')';
    for (let i = 0; i < GEODE_GLOW_STEPS; i++) {          // nested ellipses build a soft centre
      const u = i / GEODE_GLOW_STEPS;
      m.beginPath();
      m.ellipse(gw / 2, gh / 2, gw * (1 - u * 0.8) / 2, gh * (1 - u * 0.8) / 2, 0, 0, Math.PI * 2);
      m.fill();
    }
  }
  ctx.drawImage(geodeGlow, sx, sy);
  for (const [x, y, k] of geodeGlints()) drawGlint(x, y, k, GEODE_GLINT, GEODE_GLINT_HI);
}

// The IRON PICK's seam tell, drawn over the lantern dark like the GEODE light.
function drawSeamTells() {
  for (const [x, y, k] of seamTells()) drawGlint(x, y, k, ORE_GLINT, ORE_GLINT_HI);
}

/* placementOk for the faced tile, cached: it runs two BFS, so it is redone
   only when the faced tile, the player's tile, the overlay, the picked set
   or an NPC position changes - not every frame. */
let targetCache = null, editsRef = null, editsVer = 0, targetCalls = 0;
function buildTarget() {
  if (G.edits !== editsRef) { editsRef = G.edits; editsVer++; }
  const p = G.player;
  const [fx, fy] = facingTile(p);
  let key = fx + ',' + fy + '|' + p.tx + ',' + p.ty + '|' + editsVer + '|' +
            Object.keys(G.edits).length + '|' + G.picked.size + '|';
  for (const n of NPCS) key += n.x + ',' + n.y + ';';
  if (!targetCache || targetCache.key !== key) {
    targetCalls++;
    targetCache = { key, res: placementOk(fx, fy, G.edits, G.picked, npcTiles(), [p.tx, p.ty]) };
  }
  return targetCache.res;
}
function targetColour() {
  return buildTarget()[0] && (G.materials.wall || 0) > 0 ? TARGET_OK : TARGET_BAD;
}

// Crack frames, WALL pop-ins and ORE glints, over the tile layer.
function drawSandboxFx() {
  for (const [k, c] of WFX.cracks) {
    const [x, y] = k.split(',').map(Number);
    const sx = Math.round(x * TILE - camX), sy = Math.round(y * TILE - camY);
    const a = CRACK_FLASH * FLASH_SCALE * Math.min(1, c.t / CRACK_TIME);
    if (a > 0) {
      ctx.globalAlpha = a; ctx.fillStyle = '#ffffff'; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.globalAlpha = 1;
    }
    ctx.strokeStyle = '#282420'; ctx.lineWidth = 2;               // over the flash, so it reads
    ctx.beginPath();
    ctx.moveTo(sx + 7, sy + 7); ctx.lineTo(sx + 14, sy + 15); ctx.lineTo(sx + 10, sy + 22); ctx.lineTo(sx + 19, sy + 28);
    ctx.moveTo(sx + 14, sy + 15); ctx.lineTo(sx + 25, sy + 11);
    ctx.stroke();
  }
  for (const k of WFX.pops.keys()) {
    const [x, y] = k.split(',').map(Number);
    const s = popScale(k);
    // Grow out of the ground: scale about the tile's bottom centre.
    const ax = x * TILE - camX + TILE / 2, ay = y * TILE - camY + TILE;
    ctx.setTransform(s, 0, 0, s, ax, ay);
    drawWallBody(-TILE / 2, -TILE);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }
  for (const [x, y, k] of oreTells()) drawGlint(x, y, k, ORE_GLINT, ORE_GLINT_HI);
}

function drawBuildBox() {
  const [fx, fy] = facingTile(G.player);
  const col = targetColour();
  const x = Math.round(fx * TILE - camX), y = Math.round(fy * TILE - camY);
  ctx.fillStyle = col === TARGET_OK ? TARGET_OK_FILL : TARGET_BAD_FILL;
  ctx.fillRect(x, y, TILE, TILE);
  ctx.strokeStyle = col;
  ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
  if (col === TARGET_BAD) {                     // not colour alone: refusals get an x
    ctx.beginPath();
    ctx.moveTo(x + 10, y + 10); ctx.lineTo(x + TILE - 10, y + TILE - 10);
    ctx.moveTo(x + 10, y + TILE - 10); ctx.lineTo(x + TILE - 10, y + 10);
    ctx.stroke();
  }
}

function drawWorldFx() {
  for (let i = 0; i < DEBRIS_MAX; i++) {
    const p = DEBRIS[i];
    if (p.life <= 0) continue;
    const s = p.size * (p.life / p.max) + 0.5;
    ctx.fillStyle = p.col;
    ctx.fillRect(Math.round(p.x - camX - s), Math.round(p.y - camY - s), Math.max(1, Math.round(s * 2)), Math.max(1, Math.round(s * 2)));
  }
  for (let i = 0; i < FLOAT_MAX; i++) {
    const f = FLOATS[i];
    if (!f.on || f.age < f.delay) continue;
    const u = Math.min(1, f.age / FLOAT_TIME);           // one break's labels rise as a stack
    const rise = FLOAT_RISE * (1 - (1 - u) * (1 - u));   // ease-out
    const v = (f.age - f.delay) / FLOAT_TIME;            // each fades on its own clock
    ctx.globalAlpha = v < 0.6 ? 1 : Math.max(0, 1 - (v - 0.6) / 0.4);
    const x = Math.round(f.wx - camX), y = Math.round(f.wy - camY - rise);
    text(f.s, x + 1, y + 1, 13, '#14161a', 'center');
    text(f.s, x, y, 13, f.col, 'center');
  }
  ctx.globalAlpha = 1;
}

// One-frame taps: a direction pressed and released between two frames never
// shows in keys[], so press() latches it here and update() clears it after
// one overworld frame. A real hold is unchanged (it is held anyway).
const TAPS = { up: false, down: false, left: false, right: false };
function clearTaps() { TAPS.up = TAPS.down = TAPS.left = TAPS.right = false; }

/* --- audio: a tiny synth, no assets ------------------------------------- */
let actx = null;
function audio() {
  if (!actx) {
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { actx = false; }
  }
  return actx || null;
}

function tone(freq, dur, type, vol, slideTo) {
  const a = audio();
  if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol || 0.05, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination);
  o.start(); o.stop(a.currentTime + dur + 0.02);
}

function hitPitch() { return 1 + (fxRand() * 2 - 1) * HIT_PITCH_JITTER; }

// Short white-noise burst; the buffer is synthesized once and reused.
let noiseBuf = null;
function noiseClick(dur, vol) {
  const a = audio();
  if (!a) return;
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.1), a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = fxRand() * 2 - 1;
  }
  const src = a.createBufferSource(), g = a.createGain();
  src.buffer = noiseBuf;
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  src.connect(g); g.connect(a.destination);
  src.start(); src.stop(a.currentTime + dur + 0.01);
}

const SFX = {
  text:     () => tone(880, 0.03, 'square', 0.02),
  select:    () => tone(660, 0.05, 'square', 0.04),
  cursor:    () => tone(440, 0.03, 'square', 0.025),
  cancel:    () => tone(330, 0.06, 'square', 0.035),
  // Hits: a noise click transient + a pitched body, +-5% pitch per play.
  hit:       () => { const p = hitPitch(); noiseClick(0.025, 0.035); tone(200 * p, 0.12, 'sawtooth', 0.05, 90 * p); },
  // Super effective: louder click, the saw body, plus a low sine thump.
  hitStrong: () => { const p = hitPitch(); noiseClick(0.04, 0.06); tone(300 * p, 0.2, 'sawtooth', 0.065, 70 * p);
                     tone(110 * p, 0.28, 'sine', 0.08, 45 * p); },
  hitWeak:   () => { const p = hitPitch(); tone(150 * p, 0.1, 'triangle', 0.035, 110 * p); },
  faint:     () => tone(400, 0.5, 'triangle', 0.05, 60),
  level:     () => { tone(523, 0.1, 'square', 0.04); setTimeout(() => tone(784, 0.18, 'square', 0.04), 100); },
  evolve:    () => { tone(392, 0.12, 'square', 0.04); setTimeout(() => tone(523, 0.12, 'square', 0.04), 120); setTimeout(() => tone(784, 0.3, 'square', 0.05), 240); },
  throw:     () => tone(520, 0.14, 'sine', 0.05, 900),
  catch:     () => { tone(660, 0.1, 'square', 0.05); setTimeout(() => tone(880, 0.1, 'square', 0.05), 110); setTimeout(() => tone(1175, 0.25, 'square', 0.05), 220); },
  encounter: () => { tone(300, 0.08, 'square', 0.05); setTimeout(() => tone(500, 0.08, 'square', 0.05), 90); setTimeout(() => tone(300, 0.08, 'square', 0.05), 180); },
  alert:     () => { tone(880, 0.09, 'square', 0.05); setTimeout(() => tone(1100, 0.16, 'square', 0.05), 100); },
  // The hunt's jumpscare: a noise burst over a screeching fall and a sub thump.
  scare:     () => { noiseClick(0.18, 0.075); tone(900, 0.5, 'sawtooth', 0.06, 110);
                     setTimeout(() => tone(55, 0.6, 'sine', 0.08, 30), 20); },
  heal:      () => { tone(660, 0.09, 'sine', 0.05); setTimeout(() => tone(880, 0.09, 'sine', 0.05), 100); setTimeout(() => tone(1100, 0.2, 'sine', 0.05), 200); },
  buff:      () => tone(400, 0.18, 'sine', 0.04, 800),
  debuff:    () => tone(500, 0.18, 'sine', 0.04, 200),
  run:       () => tone(700, 0.2, 'sine', 0.04, 260),
  step:      () => tone(120, 0.02, 'triangle', 0.015),
  hop:       () => tone(340, 0.13, 'sine', 0.04, 720),
  // Sandbox: a gritty crack for the pick, a dull double knock for a wall.
  mine:      () => { noiseClick(0.06, 0.06); tone(180, 0.12, 'triangle', 0.05, 70); },
  place:     () => { tone(160, 0.06, 'square', 0.035); setTimeout(() => tone(120, 0.08, 'square', 0.035), 70); },
  // A CRACKED SEAM giving way: a longer crack over a low, falling body.
  mineHeavy: () => { noiseClick(0.09, 0.075); tone(120, 0.22, 'triangle', 0.06, 45);
                     setTimeout(() => tone(62, 0.32, 'sine', 0.07, 34), 20); },
  // DARK CAVE. Contact: a sharp breath in, then a falling growl with a square
  // rasp under it (the battle's "scare" screech follows it).
  hunt:      () => { noiseClick(0.16, 0.035); setTimeout(() => tone(96, 0.42, 'sawtooth', 0.065, 42), 40);
                     setTimeout(() => tone(64, 0.4, 'square', 0.025, 38), 60); },
  // The PULSE: a click, a rising sine sweep over a falling triangle whomp and a
  // sub thump - always played; then a hit crack or a miss fizzle.
  pulse:     () => { noiseClick(0.03, 0.05); tone(180, 0.3, 'sine', 0.065, 1500); tone(240, 0.34, 'triangle', 0.055, 60);
                     setTimeout(() => tone(70, 0.3, 'sine', 0.065, 40), 10); },
  pulseHit:  () => { setTimeout(() => { noiseClick(0.06, 0.06); tone(1400, 0.16, 'sawtooth', 0.03, 260); }, 50);
                     setTimeout(() => tone(66, 0.32, 'sine', 0.075, 34), 70); },
  pulseMiss: () => setTimeout(() => tone(520, 0.3, 'triangle', 0.035, 150), 60),
  // Fear (tension >= 75): a low lub-dub, a soft triangle edge so small speakers hear it.
  heartbeat: () => { tone(62, 0.16, 'sine', 0.1, 40); tone(124, 0.05, 'triangle', 0.02, 80);
                     setTimeout(() => { tone(55, 0.18, 'sine', 0.08, 36); tone(110, 0.05, 'triangle', 0.015, 70); },
                                HEART_DUB / HEART_HZ_MIN * 1000); }
};

// The DARK CAVE's ambient drone: three sine partials (55 / 55.5 / 82.5 Hz, so
// it beats slowly) into one gain that follows tension. Built once, only after
// a gesture has made the AudioContext; vol 0 fades it out. Never schedules notes.
let drone = null;
function caveDrone(vol) {
  const a = actx;
  if (!a) return;
  try {
    if (!drone) {
      if (vol <= 0) return;
      const g = a.createGain();
      g.gain.value = 0;
      g.connect(a.destination);
      for (const [f, v] of [[55, 0.5], [55.5, 0.35], [82.5, 0.2]]) {
        const o = a.createOscillator(), og = a.createGain();
        o.type = 'sine'; o.frequency.value = f; og.gain.value = v;
        o.connect(og); og.connect(g); o.start();
      }
      drone = { g, vol: 0 };
    }
    if (Math.abs(drone.vol - vol) > 0.002) {
      drone.g.gain.setTargetAtTime(vol * 0.25, a.currentTime, 0.4);   // WebAudio gains run ~4x hotter than the PCM mix
      drone.vol = vol;
    }
  } catch (e) { /* audio is optional */ }
}
function sfx(n) { try { if (SFX[n]) SFX[n](); } catch (e) { /* audio is optional */ } }

/* --- drawing helpers ---------------------------------------------------- */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function panel(x, y, w, h, fill, edge) {
  ctx.fillStyle = fill || '#f8f8f0';
  rr(x, y, w, h, 8); ctx.fill();
  ctx.strokeStyle = edge || '#2a3340';
  ctx.lineWidth = 3;
  rr(x, y, w, h, 8); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  rr(x + 4, y + 4, w - 8, h - 8, 5); ctx.stroke();
}

/* In-canvas control prompts name the input the player is actually using:
   keyboard keys by default, the DOM touch buttons once touchOn is set
   (enableTouch - coarse pointer or first touch). Touch labels are never
   longer than the key labels, so every prompt still fits its box. */
const PROMPT_KEYS  = { confirm: 'Z', confirmFull: 'Z / ENTER', cancel: 'X', move: 'ARROWS', run: 'SHIFT' };
const PROMPT_TOUCH = { confirm: 'A', confirmFull: 'A',         cancel: 'B', move: 'D-PAD',  run: 'RUN' };
function promptLabel(action) {
  return (touchOn ? PROMPT_TOUCH : PROMPT_KEYS)[action];
}

function text(s, x, y, size, color, align) {
  ctx.font = 'bold ' + (size || 14) + 'px "Courier New", monospace';
  ctx.fillStyle = color || '#22303f';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
  ctx.textAlign = 'left';
}

// Deterministic per-tile noise so scenery doesn't shimmer between frames.
function hash(x, y) {
  let h = x * 374761393 + y * 668265263;
  h = (h ^ (h >> 13)) * 1274126177;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}

/* --- procedural creature sprites ---------------------------------------- */
// amt < 0 darkens by that many units; amt > 0 lightens by that fraction
// toward white.  Keeps a palette to two authored colours per species.
function shadeBy(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const ch = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  return 'rgb(' + ch.map(v => Math.round(amt < 0
    ? Math.max(0, v + amt)
    : v + (255 - v) * amt)).join(',') + ')';
}

function drawCreature(sp, cx, cy, s, flip, backView, t) {
  // Animation clock: the battle passes its own, which stops during hit-stop.
  const T = t === undefined ? G.time : t;
  const a = sp.art;
  const scale = a.big ? s * 1.15 : s;
  ctx.save();
  ctx.translate(cx, cy);
  if (flip) ctx.scale(-1, 1);

  // Ground shadow.
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath();
  ctx.ellipse(0, scale * 0.52, scale * 0.52, scale * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();

  const eye = (ex, ey, r) => {
    if (backView) return;
    ctx.fillStyle = '#16181c';
    ctx.beginPath(); ctx.arc(ex, ey, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex + r * 0.3, ey - r * 0.35, r * 0.34, 0, Math.PI * 2); ctx.fill();
  };
  const blob = (x, y, rx, ry, col) => {
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  };
  const poly = (col, pts) => {
    ctx.fillStyle = col;
    ctx.beginPath();
    pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    ctx.closePath(); ctx.fill();
  };

  switch (a.kind) {
    case 'quad': {
      if (a.flame) {  // tail flame
        const f = 1 + Math.sin(T * 8) * 0.12;
        blob(scale * 0.46, -scale * 0.1, scale * 0.16 * f, scale * 0.26 * f, '#ff7a1a');
        blob(scale * 0.46, -scale * 0.12, scale * 0.09 * f, scale * 0.16 * f, '#ffd86a');
      }
      ctx.fillStyle = a.c1;
      ctx.beginPath(); ctx.ellipse(0, scale * 0.16, scale * 0.42, scale * 0.3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = a.c2;
      ctx.beginPath(); ctx.ellipse(0, scale * 0.26, scale * 0.28, scale * 0.16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = a.c1;
      for (const lx of [-0.26, -0.02, 0.24]) {
        ctx.fillRect(lx * scale, scale * 0.36, scale * 0.13, scale * 0.16);
      }
      if (a.mane) {
        ctx.fillStyle = '#ffb347';
        ctx.beginPath(); ctx.arc(-scale * 0.3, -scale * 0.16, scale * 0.32, 0, Math.PI * 2); ctx.fill();
      }
      blob(-scale * 0.32, -scale * 0.16, scale * 0.26, scale * 0.24, a.c1);
      ctx.fillStyle = a.c1;
      ctx.beginPath();
      ctx.moveTo(-scale * 0.46, -scale * 0.34);
      ctx.lineTo(-scale * 0.52, -scale * 0.58);
      ctx.lineTo(-scale * 0.3, -scale * 0.4);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-scale * 0.2, -scale * 0.36);
      ctx.lineTo(-scale * 0.16, -scale * 0.6);
      ctx.lineTo(-scale * 0.05, -scale * 0.34);
      ctx.closePath(); ctx.fill();
      blob(-scale * 0.44, -scale * 0.08, scale * 0.1, scale * 0.07, a.c2);
      eye(-scale * 0.38, -scale * 0.2, scale * 0.055);
      break;
    }
    case 'serpent': {
      ctx.strokeStyle = a.c1;
      ctx.lineWidth = scale * 0.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= 26; i++) {
        const t = i / 26;
        const x = (t - 0.5) * scale * 0.86;
        const y = scale * 0.3 + Math.sin(t * Math.PI * 2.4 + T * 2) * scale * 0.14;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      if (a.fins) {
        ctx.fillStyle = a.c2;
        ctx.beginPath();
        ctx.moveTo(scale * 0.34, scale * 0.24);
        ctx.lineTo(scale * 0.5, scale * 0.02);
        ctx.lineTo(scale * 0.5, scale * 0.42);
        ctx.closePath(); ctx.fill();
      }
      blob(-scale * 0.3, -scale * 0.1, scale * 0.3, scale * 0.27, a.c1);
      blob(-scale * 0.3, -scale * 0.02, scale * 0.19, scale * 0.14, a.c2);
      ctx.fillStyle = a.c2;
      ctx.beginPath();
      ctx.moveTo(-scale * 0.42, -scale * 0.3);
      ctx.lineTo(-scale * 0.3, -scale * 0.6);
      ctx.lineTo(-scale * 0.16, -scale * 0.28);
      ctx.closePath(); ctx.fill();
      eye(-scale * 0.4, -scale * 0.14, scale * 0.055);
      break;
    }
    case 'plant': {
      ctx.fillStyle = '#3f7a34';
      for (const ang of [-0.9, -0.3, 0.3, 0.9]) {
        ctx.save();
        ctx.translate(0, -scale * 0.22);
        ctx.rotate(ang + Math.sin(T * 1.6 + ang) * 0.06);
        ctx.beginPath();
        ctx.ellipse(0, -scale * 0.3, scale * 0.1, scale * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      blob(0, scale * 0.1, scale * 0.42, scale * 0.38, a.c1);
      blob(0, scale * 0.2, scale * 0.28, scale * 0.2, a.c2);
      if (a.thorns) {
        ctx.fillStyle = '#e8f0b0';
        for (const ang of [-1.2, -0.4, 0.4, 1.2]) {
          ctx.save();
          ctx.rotate(ang);
          ctx.beginPath();
          ctx.moveTo(-scale * 0.05, -scale * 0.34);
          ctx.lineTo(0, -scale * 0.52);
          ctx.lineTo(scale * 0.05, -scale * 0.34);
          ctx.closePath(); ctx.fill();
          ctx.restore();
        }
      }
      ctx.fillStyle = a.c1;
      for (const lx of [-0.24, 0.16]) ctx.fillRect(lx * scale, scale * 0.4, scale * 0.12, scale * 0.12);
      eye(-scale * 0.15, scale * 0.02, scale * 0.06);
      eye(scale * 0.15, scale * 0.02, scale * 0.06);
      break;
    }
    case 'rodent': {
      if(a.pickajoo){
        poly(a.c1,[[scale*.22,scale*.28],[scale*.52,scale*.1],[scale*.42,-scale*.05],[scale*.7,-scale*.25],[scale*.56,-scale*.36],[scale*.3,-scale*.13],[scale*.4,scale*.02]]);
        blob(0,scale*.18,scale*.3,scale*.36,a.c1);blob(0,scale*.27,scale*.21,scale*.22,a.c2);
        for(const side of [-1,1]){poly(a.c1,[[side*scale*.1,-scale*.14],[side*scale*.21,-scale*.73],[side*scale*.34,-scale*.16]]);poly('#26202a',[[side*scale*.18,-scale*.56],[side*scale*.21,-scale*.73],[side*scale*.25,-scale*.49]]);blob(side*scale*.18,scale*.47,scale*.15,scale*.08,a.c1);}
        blob(0,-scale*.05,scale*.34,scale*.28,a.c1);eye(-scale*.15,-scale*.08,scale*.055);eye(scale*.15,-scale*.08,scale*.055);
        if(!backView)for(const side of [-1,1])blob(side*scale*.23,scale*.05,scale*.075,scale*.06,'#ef4545');
        break;
      }
      ctx.fillStyle = a.c1;
      ctx.lineWidth = scale * 0.06;
      ctx.strokeStyle = a.c1;
      ctx.beginPath();
      ctx.moveTo(scale * 0.32, scale * 0.24);
      ctx.quadraticCurveTo(scale * 0.62, scale * 0.1, scale * 0.5, -scale * 0.24);
      ctx.stroke();
      blob(-scale * 0.24, -scale * 0.3, scale * 0.14, scale * 0.18, a.c1);
      blob(scale * 0.02, -scale * 0.32, scale * 0.14, scale * 0.18, a.c1);
      blob(-scale * 0.24, -scale * 0.3, scale * 0.07, scale * 0.1, a.c2);
      blob(scale * 0.02, -scale * 0.32, scale * 0.07, scale * 0.1, a.c2);
      blob(0, scale * 0.14, scale * 0.4, scale * 0.34, a.c1);
      blob(0, scale * 0.24, scale * 0.26, scale * 0.2, a.c2);
      if (a.tusks) {
        ctx.fillStyle = '#fff8e0';
        ctx.fillRect(-scale * 0.1, scale * 0.16, scale * 0.06, scale * 0.16);
        ctx.fillRect(scale * 0.04, scale * 0.16, scale * 0.06, scale * 0.16);
      }
      eye(-scale * 0.16, scale * 0.04, scale * 0.06);
      eye(scale * 0.14, scale * 0.04, scale * 0.06);
      ctx.fillStyle = '#e07a8a';
      ctx.beginPath(); ctx.arc(0, scale * 0.16, scale * 0.045, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'bug': {
      const flap = Math.sin(T * 10) * 0.3;
      if (a.glow) {
        const pulse = 1 + Math.sin(T * 5) * 0.12;
        const gl = ctx.createRadialGradient(0, scale * 0.08, 0, 0, scale * 0.08,
                                            scale * 0.46 * pulse);
        gl.addColorStop(0, a.c2);
        gl.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.globalAlpha = 0.5;
        ctx.fillStyle = gl;
        ctx.beginPath();
        ctx.arc(0, scale * 0.08, scale * 0.46 * pulse, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.strokeStyle = a.c2;
      ctx.lineWidth = 2;
      for (const sgn of [-1, 1]) {
        ctx.save();
        ctx.rotate(sgn * (0.5 + flap * sgn));
        ctx.beginPath();
        ctx.ellipse(sgn * scale * 0.3, -scale * 0.18, scale * 0.3, scale * 0.18, 0, 0, Math.PI * 2);
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      blob(0, scale * 0.08, scale * 0.2, scale * 0.32, a.c1);
      blob(0, -scale * 0.2, scale * 0.19, scale * 0.17, a.c1);
      ctx.strokeStyle = a.c1;
      ctx.lineWidth = scale * 0.035;
      for (const sgn of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sgn * scale * 0.08, -scale * 0.32);
        ctx.quadraticCurveTo(sgn * scale * 0.24, -scale * 0.56, sgn * scale * 0.1, -scale * 0.62);
        ctx.stroke();
      }
      eye(-scale * 0.09, -scale * 0.22, scale * 0.05);
      eye(scale * 0.09, -scale * 0.22, scale * 0.05);
      break;
    }
    case 'bat': {
      const beat = Math.sin(T * 8) * 0.55;
      const bdark = shadeBy(a.c1, -34);
      for (const sgn of [-1, 1]) {
        const span = 0.60 + 0.10 * Math.cos(beat);
        const lift = beat * 0.16 * sgn;
        poly(sgn < 0 ? bdark : a.c1, [
          [0, -scale * 0.06],
          [sgn * scale * span, -scale * (0.34 + lift)],
          [sgn * scale * (span - 0.06), -scale * (0.06 + lift)],
          [sgn * scale * (span - 0.16), -scale * (0.16 + lift)],
          [sgn * scale * (span - 0.24), scale * 0.04],
          [sgn * scale * (span - 0.34), -scale * 0.06],
          [sgn * scale * 0.14, scale * 0.16]]);
      }
      blob(0, scale * 0.04, scale * 0.20, scale * 0.26, a.c1);
      blob(0, scale * 0.12, scale * 0.12, scale * 0.14, a.c2);
      blob(0, -scale * 0.22, scale * 0.19, scale * 0.17, a.c1);
      for (const sgn of [-1, 1]) {
        poly(a.c1, [[sgn * scale * 0.04, -scale * 0.34],
                    [sgn * scale * 0.20, -scale * 0.66],
                    [sgn * scale * 0.21, -scale * 0.30]]);
        poly(a.c2, [[sgn * scale * 0.08, -scale * 0.36],
                    [sgn * scale * 0.17, -scale * 0.56],
                    [sgn * scale * 0.18, -scale * 0.34]]);
      }
      if (a.horns) {
        for (const sgn of [-1, 1]) {
          poly(a.c2, [[sgn * scale * 0.26, -scale * 0.30],
                      [sgn * scale * 0.40, -scale * 0.52],
                      [sgn * scale * 0.32, -scale * 0.24]]);
        }
      }
      if (!backView) {
        poly('#ffffff', [[-scale * 0.06, -scale * 0.12], [-scale * 0.02, -scale * 0.02],
                         [scale * 0.01, -scale * 0.12]]);
      }
      eye(-scale * 0.08, -scale * 0.24, scale * 0.05);
      eye(scale * 0.08, -scale * 0.24, scale * 0.05);
      break;
    }
    case 'gear': {
      const spin = T * 1.1;
      const gdark = shadeBy(a.c1, -40);
      const teeth = 10;
      const outer = [];
      for (let i = 0; i < teeth * 2; i++) {
        const ang = spin + i * Math.PI / teeth;
        const r = scale * (i % 2 === 0 ? 0.50 : 0.38);
        outer.push([Math.cos(ang) * r, Math.sin(ang) * r * 0.96 + scale * 0.04]);
      }
      poly(gdark, outer);
      blob(0, scale * 0.04, scale * 0.34, scale * 0.33, a.c1);
      blob(0, scale * 0.04, scale * 0.20, scale * 0.19, a.c2);
      if (a.spikes) {
        for (const ang of [-1.05, 0, 1.05]) {
          ctx.save(); ctx.rotate(ang);
          poly(a.c2, [[-scale * 0.06, -scale * 0.30], [0, -scale * 0.58],
                      [scale * 0.06, -scale * 0.30]]);
          ctx.restore();
        }
      }
      for (let i = 0; i < 4; i++) {
        const ang = spin * -0.7 + i * Math.PI / 2;
        blob(Math.cos(ang) * scale * 0.26, Math.sin(ang) * scale * 0.25 + scale * 0.04,
             scale * 0.035, scale * 0.035, gdark);
      }
      eye(-scale * 0.08, scale * 0.02, scale * 0.055);
      eye(scale * 0.08, scale * 0.02, scale * 0.055);
      break;
    }
    case 'crab': {
      const cdark = shadeBy(a.c1, -44);
      const snap = Math.abs(Math.sin(T * 4)) * 0.32;
      ctx.lineCap = 'round';
      for (const sgn of [-1, 1]) {
        ctx.strokeStyle = cdark;
        ctx.lineWidth = scale * 0.07;
        ctx.beginPath();
        ctx.moveTo(sgn * scale * 0.22, scale * 0.16);
        ctx.lineTo(sgn * scale * 0.42, scale * 0.02);
        ctx.stroke();
        ctx.save();
        ctx.translate(sgn * scale * 0.42, 0);
        ctx.rotate(sgn * -snap);
        poly(a.c1, [[0, 0], [sgn * scale * 0.22, -scale * 0.10],
                    [sgn * scale * 0.26, scale * 0.06], [sgn * scale * 0.08, scale * 0.10]]);
        poly(cdark, [[sgn * scale * 0.06, -scale * 0.02],
                     [sgn * scale * 0.24, -scale * 0.12], [sgn * scale * 0.22, 0]]);
        ctx.restore();
        ctx.strokeStyle = cdark;
        ctx.lineWidth = scale * 0.045;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.moveTo(sgn * scale * 0.18, scale * 0.26);
          ctx.lineTo(sgn * scale * (0.30 + i * 0.07), scale * 0.42);
          ctx.stroke();
        }
      }
      blob(0, scale * 0.18, scale * 0.36, scale * 0.24, a.c1);
      blob(0, scale * 0.22, scale * 0.24, scale * 0.14, a.c2);
      ctx.strokeStyle = cdark;
      ctx.lineWidth = scale * 0.04;
      ctx.beginPath();
      ctx.moveTo(-scale * 0.24, scale * 0.10);
      ctx.lineTo(0, scale * 0.02);
      ctx.lineTo(scale * 0.24, scale * 0.10);
      ctx.stroke();
      for (const sgn of [-1, 1]) {
        ctx.strokeStyle = a.c1;
        ctx.lineWidth = scale * 0.05;
        ctx.beginPath();
        ctx.moveTo(sgn * scale * 0.12, scale * 0.02);
        ctx.lineTo(sgn * scale * 0.14, -scale * 0.20);
        ctx.stroke();
        eye(sgn * scale * 0.14, -scale * 0.24, scale * 0.06);
      }
      break;
    }
    case 'bird': {
      const flap = Math.sin(T * 7) * 0.42;
      const dark = shadeBy(a.c1, -42);
      const light = shadeBy(a.c1, 0.34);
      const gold = '#eeb048';
      // Tail fan and far wing first, so the body overlaps both.
      poly(dark, [[scale * 0.22, scale * 0.02], [scale * 0.52, -scale * 0.12],
                  [scale * 0.63, scale * 0.02], [scale * 0.57, scale * 0.19],
                  [scale * 0.26, scale * 0.24]]);
      ctx.save();
      ctx.translate(scale * 0.04, scale * 0.04);
      ctx.rotate(-flap * 0.5);
      poly(dark, [[0, 0], [scale * 0.34, -scale * 0.02], [scale * 0.22, scale * 0.18]]);
      ctx.restore();
      blob(0, scale * 0.10, scale * 0.34, scale * 0.30, a.c1);
      blob(-scale * 0.05, scale * 0.16, scale * 0.21, scale * 0.18, a.c2);
      // Near wing in a mid slate, so it reads against the pale belly rather
      // than merging into it, with a darker feather layered on top.
      ctx.save();
      ctx.rotate(flap);
      poly(light, [[-scale * 0.06, -scale * 0.04], [scale * 0.40, -scale * 0.16],
                   [scale * 0.27, scale * 0.16]]);
      poly(dark, [[scale * 0.01, scale * 0.01], [scale * 0.31, -scale * 0.10],
                  [scale * 0.23, scale * 0.11]]);
      ctx.restore();
      ctx.fillStyle = gold;
      ctx.fillRect(-scale * 0.10, scale * 0.36, scale * 0.05, scale * 0.12);
      ctx.fillRect(scale * 0.06, scale * 0.36, scale * 0.05, scale * 0.12);
      blob(-scale * 0.22, -scale * 0.22, scale * 0.19, scale * 0.19, a.c1);
      poly(a.c2, [[-scale * 0.32, -scale * 0.36], [-scale * 0.25, -scale * 0.60],
                  [-scale * 0.14, -scale * 0.34]]);
      poly(gold, [[-scale * 0.36, -scale * 0.26], [-scale * 0.60, -scale * 0.18],
                  [-scale * 0.36, -scale * 0.10]]);
      eye(-scale * 0.24, -scale * 0.27, scale * 0.055);
      break;
    }
    case 'spark': {
      const p = 1 + Math.sin(T * 9) * 0.08;
      ctx.fillStyle = a.c2;
      ctx.globalAlpha = 0.35;
      ctx.beginPath(); ctx.arc(0, 0, scale * 0.55 * p, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.fillStyle = a.c1;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2 - Math.PI / 2;
        const r = (i % 2 ? 0.24 : 0.46) * scale * p;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath(); ctx.fill();
      blob(0, 0, scale * 0.2, scale * 0.2, a.c2);
      eye(-scale * 0.08, -scale * 0.02, scale * 0.045);
      eye(scale * 0.08, -scale * 0.02, scale * 0.045);
      break;
    }
    case 'rock': {
      ctx.fillStyle = a.c1;
      ctx.beginPath();
      const pts = [[-0.44, 0.18], [-0.34, -0.26], [-0.06, -0.44], [0.28, -0.32],
                   [0.46, 0.02], [0.36, 0.38], [-0.12, 0.46], [-0.4, 0.38]];
      pts.forEach(([x, y], i) => i ? ctx.lineTo(x * scale, y * scale) : ctx.moveTo(x * scale, y * scale));
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = a.c2;
      ctx.beginPath();
      ctx.moveTo(-scale * 0.2, -scale * 0.3);
      ctx.lineTo(scale * 0.1, -scale * 0.36);
      ctx.lineTo(scale * 0.02, -scale * 0.12);
      ctx.closePath(); ctx.fill();
      if (a.crystals) {
        ctx.fillStyle = '#7fd8e8';
        for (const [bx, by] of [[-0.3, -0.34], [0.22, -0.42], [0.42, -0.06]]) {
          ctx.beginPath();
          ctx.moveTo(bx * scale, by * scale);
          ctx.lineTo((bx + 0.07) * scale, (by - 0.22) * scale);
          ctx.lineTo((bx + 0.14) * scale, by * scale);
          ctx.closePath(); ctx.fill();
        }
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-scale * 0.26, scale * 0.3);
      ctx.lineTo(-scale * 0.06, scale * 0.12);
      ctx.lineTo(scale * 0.16, scale * 0.34);
      ctx.stroke();
      eye(-scale * 0.16, scale * 0.02, scale * 0.06);
      eye(scale * 0.16, scale * 0.02, scale * 0.06);
      break;
    }
    case 'ooze': {
      ctx.fillStyle = a.c1;
      ctx.beginPath();
      for (let i = 0; i <= 32; i++) {
        const ang = (i / 32) * Math.PI * 2;
        const wob = 1 + Math.sin(ang * 3 + T * 3) * 0.08;
        const r = scale * 0.42 * wob;
        const x = Math.cos(ang) * r, y = Math.sin(ang) * r * 0.92 + scale * 0.08;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = a.c2;
      ctx.globalAlpha = 0.7;
      for (const [bx, by, br] of [[-0.16, -0.12, 0.08], [0.18, 0.04, 0.06], [0.02, 0.22, 0.05]]) {
        ctx.beginPath(); ctx.arc(bx * scale, by * scale + scale * 0.08, br * scale, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
      eye(-scale * 0.14, -scale * 0.02, scale * 0.06);
      eye(scale * 0.14, -scale * 0.02, scale * 0.06);
      ctx.strokeStyle = '#16181c';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, scale * 0.14, scale * 0.12, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
      break;
    }
    case 'wisp': {
      const bob = Math.sin(T * 3) * scale * 0.06;
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = a.c2;
      ctx.beginPath(); ctx.arc(0, bob, scale * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      if (a.relic) {
        // DUNEGHAST wears a broken stone halo rather than a smooth ring.
        for (let i = 0; i < 7; i++) {
          const ang = T * 0.6 + i * (Math.PI * 2 / 7);
          const px = Math.cos(ang) * scale * 0.46;
          const py = Math.sin(ang) * scale * 0.20;
          poly(a.c2, [[px - scale * 0.06, py + bob - scale * 0.05],
                      [px + scale * 0.06, py + bob - scale * 0.06],
                      [px + scale * 0.05, py + bob + scale * 0.06],
                      [px - scale * 0.06, py + bob + scale * 0.05]]);
        }
      } else {
        ctx.strokeStyle = a.c2;
        ctx.lineWidth = scale * 0.05;
        ctx.beginPath();
        ctx.ellipse(0, bob, scale * 0.46, scale * 0.2, T % (Math.PI * 2), 0, Math.PI * 2);
        ctx.stroke();
      }
      blob(0, bob, scale * 0.3, scale * 0.3, a.c1);
      ctx.fillStyle = a.c1;
      ctx.beginPath();
      ctx.moveTo(-scale * 0.1, bob + scale * 0.26);
      ctx.quadraticCurveTo(0, bob + scale * 0.62, scale * 0.12, bob + scale * 0.3);
      ctx.closePath(); ctx.fill();
      eye(-scale * 0.1, bob - scale * 0.02, scale * 0.055);
      eye(scale * 0.1, bob - scale * 0.02, scale * 0.055);
      break;
    }
  }
  ctx.restore();
}

/* --- overworld tiles ---------------------------------------------------- */
// Signs, item balls and ledges sit on whatever ground surrounds them.
// Without this they always painted a grass square, which looked wrong on the
// beach and plain broken on a cave floor.
// The glyph a collected item ball leaves behind: the same ground groundTone
// paints under it, so a taken cave ball is cave floor, not a square of lawn.
function pickedGround(gx, gy) {
  const near = [[0, 1], [0, -1], [-1, 0], [1, 0]].map(([dx, dy]) => tileAt(gx + dx, gy + dy));
  return ['c', 's', '_'].find(g => near.includes(g)) || '.';
}

const PICKED_TEXT = { c: 'a scuff on the cave floor', s: 'a hollow in the sand',
                      _: 'a scuff on the path', scree: 'a scrape in the scree',
                      '.': 'a dent in the grass' };

// What a collected item ball leaves behind, by the ground pickedGround paints
// there (ROCKY PASS ground is scree, not grass).
function pickedText(gx, gy) {
  let g = pickedGround(gx, gy);
  if (g === '.' && gy >= ROCK_BAND[0] && gy <= ROCK_BAND[1]) g = 'scree';
  return PICKED_TEXT[g];
}

function groundTone(gx, gy) {
  const near = [[0, 1], [0, -1], [-1, 0], [1, 0]].map(([dx, dy]) => tileAt(gx + dx, gy + dy));
  if (near.includes('c')) return '#383440';
  if (near.includes('s')) return '#e0cc96';
  if (near.includes('_')) return '#c0a87c';
  if (gy >= ROCK_BAND[0] && gy <= ROCK_BAND[1]) return '#948c7c';
  return '#5aa557';
}

function drawTile(t, sx, sy, gx, gy) {
  const n = hash(gx, gy);
  const rocky = gy >= ROCK_BAND[0] && gy <= ROCK_BAND[1];
  switch (t) {
    case '.':
      if (rocky) {
        // Scree rather than lawn, so the pass reads as a pass.
        ctx.fillStyle = n > 0.85 ? '#9e9686' : '#948c7c';
        ctx.fillRect(sx, sy, TILE, TILE);
        if (n > 0.8) {
          ctx.fillStyle = '#847c6e';
          ctx.fillRect(sx + 7 + n * 10, sy + 9 + n * 9, 5, 3);
        }
        if (n < 0.2) { ctx.fillStyle = '#a8a090'; ctx.fillRect(sx + 20, sy + 22, 4, 3); }
      } else {
        ctx.fillStyle = n > 0.85 ? '#63ac5e' : '#5aa557';
        ctx.fillRect(sx, sy, TILE, TILE);
        if (n > 0.93) {
          ctx.fillStyle = '#4f9a4d';
          ctx.fillRect(sx + 8 + n * 10, sy + 10 + n * 8, 4, 3);
        }
      }
      break;
    case '_':
      ctx.fillStyle = n > 0.8 ? '#c8b083' : '#c0a87c';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = 'rgba(140,116,80,0.5)';
      if (n > 0.6) ctx.fillRect(sx + 6, sy + 18, 5, 3);
      if (n < 0.3) ctx.fillRect(sx + 20, sy + 8, 4, 3);
      break;
    case ',': {
      ctx.fillStyle = '#3f8a44';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.strokeStyle = '#2f6e34';
      ctx.lineWidth = 2;
      const sway = Math.sin(G.time * 2 + gx * 0.7 + gy * 0.4) * 2;
      for (let i = 0; i < 4; i++) {
        const bx = sx + 5 + i * 7;
        ctx.beginPath();
        ctx.moveTo(bx, sy + TILE - 2);
        ctx.quadraticCurveTo(bx + sway, sy + 14, bx + sway * 1.6, sy + 5);
        ctx.stroke();
      }
      break;
    }
    case '~': {
      ctx.fillStyle = '#3a72b8';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.strokeStyle = 'rgba(180,220,255,0.45)';
      ctx.lineWidth = 2;
      const off = Math.sin(G.time * 1.8 + gx * 0.5 + gy * 0.3) * 3;
      ctx.beginPath();
      ctx.moveTo(sx + 4, sy + 12 + off);
      ctx.lineTo(sx + 14, sy + 12 + off);
      ctx.moveTo(sx + 18, sy + 22 - off);
      ctx.lineTo(sx + 28, sy + 22 - off);
      ctx.stroke();
      break;
    }
    case '#':
      if (rocky) {
        // A boulder, not a pine.
        ctx.fillStyle = '#948c7c';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = n > 0.5 ? '#767066' : '#6c665e';
        ctx.beginPath();
        [[4, 24], [7, 12], [14, 6], [24, 9], [29, 18], [27, 28], [10, 29]]
          .forEach(([bx, by], i) => i ? ctx.lineTo(sx + bx, sy + by)
                                      : ctx.moveTo(sx + bx, sy + by));
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#928c82';
        ctx.beginPath();
        ctx.moveTo(sx + 12, sy + 11); ctx.lineTo(sx + 21, sy + 13);
        ctx.lineTo(sx + 16, sy + 19);
        ctx.closePath(); ctx.fill();
        ctx.strokeStyle = '#544f48';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx + 9, sy + 25); ctx.lineTo(sx + 20, sy + 21);
        ctx.stroke();
      } else {
        ctx.fillStyle = '#4f9a4d';
        ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#6b4a2a';
        ctx.fillRect(sx + 13, sy + 18, 6, 14);
        ctx.fillStyle = n > 0.5 ? '#2c6b33' : '#275e2d';
        ctx.beginPath(); ctx.arc(sx + 16, sy + 14, 13, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.09)';
        ctx.beginPath(); ctx.arc(sx + 11, sy + 9, 5, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case 'B': {
      const ruin = gy >= RUINS_BAND[0] && gy <= RUINS_BAND[1];
      ctx.fillStyle = ruin ? '#928c80' : '#9aa3ad';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = ruin ? '#787268' : '#7f8892';
      ctx.fillRect(sx, sy, TILE, 3);
      ctx.fillStyle = ruin ? '#5c574f' : '#5b6672';
      ctx.fillRect(sx + 2, sy + 2, TILE - 4, 2);
      if (ruin) {
        // Weathered pillar stone: seams and chips, never windows.
        ctx.strokeStyle = '#706a60';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(sx, sy + 14); ctx.lineTo(sx + TILE, sy + 14);
        ctx.moveTo(sx + 16, sy + 14); ctx.lineTo(sx + 16, sy + TILE);
        ctx.stroke();
        if (n > 0.7) {
          ctx.fillStyle = '#787268';
          ctx.beginPath();
          ctx.moveTo(sx + 6, sy + 22); ctx.lineTo(sx + 12, sy + 19);
          ctx.lineTo(sx + 10, sy + 26);
          ctx.closePath(); ctx.fill();
        }
      } else if ((gx + gy) % 3 === 0) {
        ctx.fillStyle = '#c9e6ff';
        ctx.fillRect(sx + 8, sy + 10, 16, 12);
        ctx.strokeStyle = '#5b6672';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx + 8, sy + 10, 16, 12);
      }
      break;
    }
    case ';': {
      // Dark grass: rarer, meaner encounters than ordinary tall grass.
      ctx.fillStyle = '#263e36';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.strokeStyle = '#182c26';
      ctx.lineWidth = 2;
      const dsway = Math.sin(G.time * 1.6 + gx * 0.7 + gy * 0.4) * 2;
      for (let i = 0; i < 4; i++) {
        const bx = sx + 5 + i * 7;
        ctx.beginPath();
        ctx.moveTo(bx, sy + TILE - 2);
        ctx.quadraticCurveTo(bx + dsway, sy + 13, bx + dsway * 1.6, sy + 3);
        ctx.stroke();
      }
      if (n > 0.88) {
        ctx.fillStyle = '#78b096';
        ctx.beginPath(); ctx.arc(sx + 16, sy + 12, 2, 0, Math.PI * 2); ctx.fill();
      }
      break;
    }
    case 'c':
      ctx.fillStyle = n > 0.8 ? '#3e3a46' : '#383440';
      ctx.fillRect(sx, sy, TILE, TILE);
      if (n > 0.9) { ctx.fillStyle = '#302c38'; ctx.fillRect(sx + 9, sy + 12, 7, 4); }
      if (n < 0.12) {
        ctx.fillStyle = '#4a4654';
        ctx.beginPath(); ctx.arc(sx + 22, sy + 20, 3, 0, Math.PI * 2); ctx.fill();
      }
      break;
    case 'K': {
      // A CRACKED SEAM: cave rock split by a fault with ORE lit in the gap -
      // warm, high-contrast lines so it reads inside the lantern.
      ctx.fillStyle = '#282430';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = '#36303e';
      ctx.fillRect(sx, sy, TILE, 5);
      const fault = [[6, 2], [14, 11], [10, 18], [19, 24], [15, 31]];
      ctx.lineJoin = 'round';
      for (const [col, wdt] of [['#0e0c14', 6], [SEAM_EDGE, 2]]) {
        ctx.strokeStyle = col; ctx.lineWidth = wdt;
        ctx.beginPath();
        fault.forEach(([fx, fy], i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, sx + fx, sy + fy));
        ctx.stroke();
      }
      for (const [col, wdt] of [['#0e0c14', 4], [SEAM_EDGE, 1]]) {
        ctx.strokeStyle = col; ctx.lineWidth = wdt;
        ctx.beginPath(); ctx.moveTo(sx + 14, sy + 11); ctx.lineTo(sx + 27, sy + 7); ctx.stroke();
      }
      ctx.lineJoin = 'miter'; ctx.lineWidth = 1;
      ctx.fillStyle = ORE_GLINT;
      for (const [ox, oy] of [[11, 17], [18, 23], [23, 8]]) ctx.fillRect(sx + ox, sy + oy, 3, 3);
      break;
    }
    case 'C':
      ctx.fillStyle = '#282430';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = '#36303e';
      ctx.fillRect(sx, sy, TILE, 5);
      ctx.fillStyle = '#1e1b26';
      ctx.beginPath();
      ctx.moveTo(sx, sy + 8); ctx.lineTo(sx + 12, sy + 16); ctx.lineTo(sx, sy + 24);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#302b38';
      ctx.beginPath();
      ctx.moveTo(sx + TILE, sy + 10); ctx.lineTo(sx + 20, sy + 19);
      ctx.lineTo(sx + TILE, sy + 28);
      ctx.closePath(); ctx.fill();
      break;
    case 's':
      ctx.fillStyle = n > 0.8 ? '#e8d6a2' : '#e0cc96';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = '#ceb882';
      if (n > 0.86) { ctx.beginPath(); ctx.arc(sx + 10, sy + 20, 2, 0, Math.PI * 2); ctx.fill(); }
      if (n < 0.15) { ctx.beginPath(); ctx.arc(sx + 23, sy + 9, 2, 0, Math.PI * 2); ctx.fill(); }
      break;
    case '=':
      ctx.fillStyle = '#3a72b8';
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = '#967042';
      ctx.fillRect(sx, sy + 4, TILE, TILE - 8);
      ctx.strokeStyle = '#70522e';
      ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + i * 8, sy + 4); ctx.lineTo(sx + i * 8, sy + TILE - 5);
        ctx.stroke();
      }
      ctx.strokeStyle = '#ba9460';
      ctx.beginPath(); ctx.moveTo(sx, sy + 6); ctx.lineTo(sx + TILE, sy + 6); ctx.stroke();
      break;
    case 'f': {
      ctx.fillStyle = '#5aa557';
      ctx.fillRect(sx, sy, TILE, TILE);
      const petals = ['#e87896', '#f0dc6e', '#c88ce6'];
      [[8, 10], [21, 17], [13, 24]].forEach(([fx2, fy2], i) => {
        ctx.fillStyle = petals[(gx + gy + i) % 3];
        ctx.beginPath(); ctx.arc(sx + fx2, sy + fy2, 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#faf5dc';
        ctx.beginPath(); ctx.arc(sx + fx2, sy + fy2, 1, 0, Math.PI * 2); ctx.fill();
      });
      break;
    }
    case 'S':
      ctx.fillStyle = groundTone(gx, gy);
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = '#6e4e2e';
      ctx.fillRect(sx + 14, sy + 18, 5, 13);
      ctx.fillStyle = '#a8804a';
      ctx.fillRect(sx + 5, sy + 6, TILE - 10, 15);
      ctx.strokeStyle = '#6e4e2e';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx + 5, sy + 6, TILE - 10, 15);
      ctx.strokeStyle = '#5c4228';
      ctx.lineWidth = 1;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + 8, sy + 10 + i * 4);
        ctx.lineTo(sx + TILE - 9, sy + 10 + i * 4);
        ctx.stroke();
      }
      break;
    case 'o': {
      ctx.fillStyle = groundTone(gx, gy);
      ctx.fillRect(sx, sy, TILE, TILE);
      const bcx = sx + TILE / 2, bcy = sy + TILE / 2 + 2;
      ctx.fillStyle = '#e84a4a';
      ctx.beginPath(); ctx.arc(bcx, bcy, 8, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#f4f4f4';
      ctx.beginPath(); ctx.arc(bcx, bcy, 8, 0, Math.PI); ctx.fill();
      ctx.fillStyle = '#2a3340';
      ctx.fillRect(bcx - 8, bcy - 1.5, 16, 3);
      ctx.beginPath(); ctx.arc(bcx, bcy, 3, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case 'v':
      // A ledge: ground on top, a shadowed lip you drop off southward.
      ctx.fillStyle = groundTone(gx, gy);
      ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = '#7a603a';
      ctx.fillRect(sx, sy + 14, TILE, 12);
      ctx.fillStyle = '#96784a';
      ctx.fillRect(sx, sy + 14, TILE, 4);
      ctx.fillStyle = '#403220';
      ctx.fillRect(sx, sy + 26, TILE, 4);
      ctx.fillStyle = '#c4aa6e';
      for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.moveTo(sx + 9 + i * 14, sy + 30);
        ctx.lineTo(sx + 15 + i * 14, sy + 30);
        ctx.lineTo(sx + 12 + i * 14, sy + 35);
        ctx.closePath(); ctx.fill();
      }
      break;
    case 'H': case 'D': case 'G': {
      ctx.fillStyle = '#9aa3ad';
      ctx.fillRect(sx, sy, TILE, TILE);
      const col = t === 'H' ? '#e05a72' : t === 'G' ? '#e8c22e' : '#6fa8d8';
      ctx.fillStyle = '#3a4149';
      ctx.fillRect(sx + 5, sy + 6, TILE - 10, TILE - 6);
      ctx.fillStyle = col;
      ctx.fillRect(sx + 7, sy + 8, TILE - 14, 8);
      ctx.fillStyle = '#c9e6ff';
      ctx.fillRect(sx + 8, sy + 19, TILE - 16, 13);
      break;
    }
    case 'W': {
      // A player-built wall: coursed stone blocks on the pass's scree.
      ctx.fillStyle = '#948c7c';
      ctx.fillRect(sx, sy, TILE, TILE);
      drawWallBody(sx, sy);
      break;
    }
    default:
      ctx.fillStyle = '#5aa557';
      ctx.fillRect(sx, sy, TILE, TILE);
  }
}

// The WALL without its ground, so the pop-in can scale just the stones.
function drawWallBody(sx, sy) {
  ctx.fillStyle = '#54504c';
  ctx.fillRect(sx + 1, sy + 3, TILE - 2, TILE - 4);
  for (let row = 0; row < 3; row++) {
    const off = row % 2 === 0 ? 0 : 7;
    for (let col = -1; col < 3; col++) {
      const bx = sx + 2 + off + col * 14;
      const x0 = Math.max(bx, sx + 2), x1 = Math.min(bx + 12, sx + TILE - 2);
      if (x1 - x0 < 3) continue;
      ctx.fillStyle = (col + row) % 2 ? '#b0aa9e' : '#a29c92';
      ctx.fillRect(x0, sy + 5 + row * 9, x1 - x0, 7);
    }
  }
  ctx.fillStyle = '#c6c0b4';
  ctx.fillRect(sx + 1, sy + 3, TILE - 2, 2);
}

function drawHuman(cx, cy, dir, c1, c2, bob) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 13, 10, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  const b = bob ? Math.sin(bob) * 1.5 : 0;
  ctx.translate(0, b);
  // legs
  ctx.fillStyle = '#39414d';
  ctx.fillRect(-6, 4, 5, 9);
  ctx.fillRect(1, 4, 5, 9);
  // body
  ctx.fillStyle = c1;
  ctx.fillRect(-8, -6, 16, 12);
  ctx.fillStyle = c2;
  ctx.fillRect(-8, -6, 16, 4);
  // head
  ctx.fillStyle = '#e8c39a';
  ctx.beginPath(); ctx.arc(0, -13, 8, 0, Math.PI * 2); ctx.fill();
  // hair / cap
  ctx.fillStyle = c2;
  ctx.beginPath();
  ctx.arc(0, -14, 8, Math.PI, Math.PI * 2);
  ctx.closePath(); ctx.fill();
  if (dir !== 'up') {
    ctx.fillStyle = '#16181c';
    if (dir === 'down') {
      ctx.fillRect(-4, -14, 2.5, 3);
      ctx.fillRect(2, -14, 2.5, 3);
    } else if (dir === 'left') {
      ctx.fillRect(-5, -14, 2.5, 3);
    } else {
      ctx.fillRect(3, -14, 2.5, 3);
    }
  }
  ctx.restore();
}

/* --- overworld render --------------------------------------------------- */
// DARK CAVE is unlit: you see a lantern's worth of floor and no more, with a
// soft warm edge that follows the charge in LANTERN buckets. One small hole
// sprite (and one flicker ring) per bucket is built once and cached; the rest
// of the screen is filled flat around it. The hole is clear inside
// LANTERN.corePx, so the 4 neighbouring tiles are lit even at empty.
const caveMasks = new Map();      // bucket -> { hole, ring }
const CAVE_DARK = rgbStr(LAMP_DARK, (LAMP_DARK_ALPHA / 255).toFixed(3));
function lampSprites(charge) {
  const b = lanternBucket(charge);
  let got = caveMasks.get(b);
  if (!got) {
    const lit = Math.round(lanternRadius(charge) * TILE), r = lampHoleRadius(charge), core = LANTERN.corePx;
    const hole = document.createElement('canvas');
    hole.width = hole.height = r * 2;
    const m = hole.getContext('2d');
    const gr = m.createRadialGradient(r, r, core, r, r, r);
    const N = 32;
    for (let i = 0; i <= N; i++) {
      const [rgb, a] = lampProfile(core + (r - core) * i / N, lit);
      gr.addColorStop(i / N, rgbStr(i === 0 ? LAMP_TINT : rgb, (a / 255).toFixed(3)));
    }
    m.fillStyle = gr;
    m.fillRect(0, 0, r * 2, r * 2);
    const ring = document.createElement('canvas');
    ring.width = ring.height = r * 2;
    const n = ring.getContext('2d');
    const rg = n.createRadialGradient(r, r, core, r, r, r);
    rg.addColorStop(0, rgbStr(LAMP_DARK, 0));
    rg.addColorStop(1, rgbStr(LAMP_DARK, (LAMP_FLICKER_ALPHA / 255).toFixed(3)));
    n.fillStyle = rg;
    n.beginPath(); n.arc(r, r, r, 0, Math.PI * 2); n.fill();
    got = { hole, ring };
    caveMasks.set(b, got);
  }
  return got;
}

function drawCaveDark(cx, cy) {
  const { hole, ring } = lampSprites(G.lantern);
  const r = hole.width / 2;
  const x0 = Math.round(cx) - r, y0 = Math.round(cy) - r;
  ctx.fillStyle = CAVE_DARK;
  ctx.fillRect(0, 0, W, Math.max(0, y0));
  ctx.fillRect(0, y0 + 2 * r, W, Math.max(0, H - (y0 + 2 * r)));
  ctx.fillRect(0, y0, Math.max(0, x0), 2 * r);
  ctx.fillRect(x0 + 2 * r, y0, Math.max(0, W - (x0 + 2 * r)), 2 * r);
  ctx.drawImage(hole, x0, y0);
  const f = CFX.flicker * lampFlickerAmp(G.lantern, caveCalm());
  if (f > 0.01) { ctx.globalAlpha = Math.min(1, f); ctx.drawImage(ring, x0, y0); ctx.globalAlpha = 1; }
}

// A cached additive glow (transparent outside), radius r px.
const eyeGlows = new Map();
function eyeGlow(r) {
  let c = eyeGlows.get(r);
  if (!c) {
    c = document.createElement('canvas');
    c.width = c.height = r * 2;
    const m = c.getContext('2d');
    const gr = m.createRadialGradient(r, r, 0, r, r, r);
    gr.addColorStop(0, rgbStr(EYE_COL, 0.6));
    gr.addColorStop(1, rgbStr(EYE_COL, 0));
    m.fillStyle = gr;
    m.fillRect(0, 0, r * 2, r * 2);
    eyeGlows.set(r, c);
  }
  return c;
}

// The GLOOMSTALK in the overworld. eyes=false: a shadow of its body, drawn
// under the darkness so the lantern decides whether you see it. eyes=true:
// glowing eyes over the darkness while it hunts within sense (blinking,
// drifting, a fading trail as it moves), dimmed eyes and a daze while
// stunned, and the swelling flare of a lunge.
let shadeCv = null;
function drawStalker(eyes) {
  const st = G.stalker;
  if (!st) return;
  const [wx, wy] = stalkerPx(st);
  const sx = wx - camX, sy = wy - camY;
  if (!eyes) {
    if (!shadeCv) { shadeCv = document.createElement('canvas'); shadeCv.width = shadeCv.height = 96; }
    const m = shadeCv.getContext('2d');
    m.globalCompositeOperation = 'source-over';
    m.clearRect(0, 0, 96, 96);
    const keep = ctx;
    ctx = m;                                     // drawCreature draws on ctx
    try { drawCreature(SPECIES[HUNT.species], 48, 50, 30, false, false, G.time); } finally { ctx = keep; }
    // Darken it to a shadow inside its own shape (pygame multiplies by
    // STALKER_SHADE; a dark wash over the sprite reads the same).
    m.globalCompositeOperation = 'source-atop';
    m.fillStyle = 'rgba(14,10,24,0.78)';
    m.fillRect(0, 0, 96, 96);
    m.globalCompositeOperation = 'source-over';
    ctx.drawImage(shadeCv, Math.round(sx) - 48, Math.round(sy) + 2 - 50);
    return;
  }
  const lunge = CFX.lungeAge !== null;
  const kind = lunge ? 'hunt' : stalkerEyes(st, [G.player.tx, G.player.ty], G.lantern, G.tension);
  if (!kind) return;
  const calm = caveCalm();
  if (kind === 'stun') {
    ctx.fillStyle = rgbStr(EYE_STUN_COL);
    for (const dx of [-5, 5]) { ctx.beginPath(); ctx.arc(sx + dx, sy - 4, 2, 0, Math.PI * 2); ctx.fill(); }
    if (calm) text('z', sx + 10, sy - 12, 11, rgbStr(EYE_STUN_COL));
    else {
      ctx.fillStyle = '#c4cee2';
      for (let i = 0; i < 3; i++) {                // a small daze, circling its head
        const a = G.time * 4 + i * Math.PI * 2 / 3;
        ctx.fillRect(Math.round(sx + Math.cos(a) * 9) - 1, Math.round(sy - 17 + Math.sin(a) * 3) - 1, 2, 2);
      }
    }
    return;
  }
  if (!calm) {
    for (const tr of CFX.trail) {
      if (tr.t <= 0) continue;
      ctx.fillStyle = rgbStr(EYE_COL, (0.5 * tr.t / TRAIL_TIME).toFixed(3));
      for (const dx of [-5, 5]) { ctx.beginPath(); ctx.arc(tr.x - camX + dx, tr.y - camY - 4, 2, 0, Math.PI * 2); ctx.fill(); }
    }
  }
  const u = lunge ? Math.min(1, CFX.lungeAge / LUNGE_TIME) : 0;
  const scale = 1 + (LUNGE_EYE_SCALE - 1) * smoothstep(u);
  const bob = calm || lunge ? 0 : Math.sin(G.time * Math.PI * 2 * 0.9) * EYE_BOB;
  const ey = Math.round(sy - 4 + bob), gr = Math.round(6 * scale);
  const glow = eyeGlow(gr), blink = CFX.blink > 0 && !lunge;
  for (const dx of [-5, 5]) {
    const ex = Math.round(sx + dx * scale);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glow, ex - gr, ey - gr);
